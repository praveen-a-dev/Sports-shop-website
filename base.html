<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .center{
            height: 200px;
            position: relative;
            border: 3px solid green;
        }
        .center p{
            margin: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%),-50%;
        }
        
    </style>
</head>
<body>
    <h2>centering with flex</h2>
    <p>Lorem ipsum dolor sit ametc consectetur adipisicing elit. Fugit eos labore velit iure eum iste pariatur ducimus, alias voluptatibus minima!</p>
<div class="center">
    <p>I  am verticaly nd horizontal centered.</p>
</div>
</body>
</html>
