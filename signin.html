<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="ms.jpg">
    <title>Sign In - MS Sports</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1d1634 0%, #3b2b64 100%);
            color: #fff;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.95);
            color: #2f234f;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }
        h1 { font-size: 28px; margin-bottom: 8px; }
        p { color: #6b647d; margin-bottom: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #ddd;
            margin-bottom: 16px;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(90deg, #f6c76a 0%, #d99b4f 100%);
            color: #2f234f;
            font-weight: 700;
            cursor: pointer;
        }
        .note { margin-top: 12px; font-size: 14px; color: #6b647d; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sign In</h1>
        <p>Welcome back! Please sign in to continue.</p>
        <form id="signinForm">
            <label for="email">Email</label>
            <input type="email" id="email" required>
            <label for="password">Password</label>
            <input type="password" id="password" required>
            <button type="submit">Sign In</button>
        </form>
        <p id="errorMsg" class="note" style="color:#c0392b; display:none;">Email or password is incorrect.</p>
        <p class="note">Use: admin@mssports.com / 123456</p>
    </div>

    <script>
        const storedUsers = JSON.parse(localStorage.getItem('users') || '[]');
        if (storedUsers.length === 0) {
            storedUsers.push({
                email: 'admin@mssports.com',
                password: '123456'
            });
            localStorage.setItem('users', JSON.stringify(storedUsers));
        }

        document.getElementById('signinForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            const user = storedUsers.find(function (u) {
                return u.email === email && u.password === password;
            });

            if (user) {
                localStorage.setItem('signedIn', 'true');
                window.location.href = 'home.html';
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
